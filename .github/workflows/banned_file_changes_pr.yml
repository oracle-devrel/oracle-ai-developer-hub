name: Banned file changes (PR)

# Guards the repository against pull requests that modify protected files.
#
# Rewritten to use GitHub-owned tooling only. The previous revision called
# oracle-devrel/action-git-num-commits, oracle-devrel/action-git-files-changed
# and mshick/add-pr-comment, none of which are on the organization's
# allowed-actions list, so every run failed at startup and no pull request was
# ever actually checked.
#
# The changed-file list is read through the REST API, so untrusted pull request
# code is never checked out with the write-scoped pull_request_target token.
#
# Maintainers (OWNER/MEMBER/COLLABORATOR) are exempt so CI itself stays
# patchable through pull requests. Drop the author_association conditions on
# the last two steps to make the rule absolute.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  check_for_banned_file_changes:
    name: Look for unsupported (banned) file modifications on PRs
    runs-on: ubuntu-latest
    steps:
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' | sort > changed_files.txt
          echo "Changed files:"
          sed 's/^/  /' changed_files.txt

      - name: Detect banned file changes
        id: detect
        run: |
          : > banned_files.txt
          while IFS= read -r file; do
            case "$file" in
              .github/*|license_policy.yml|repolinter.json|sonar-project.properties)
                echo "$file" >> banned_files.txt
                ;;
            esac
          done < changed_files.txt

          if [ -s banned_files.txt ]; then
            echo "banned=true" >> "$GITHUB_OUTPUT"
            echo "Banned files modified:"
            sed 's/^/  /' banned_files.txt
          else
            echo "banned=false" >> "$GITHUB_OUTPUT"
            echo "No banned file changes."
          fi

      - name: Comment on banned file changes
        if: steps.detect.outputs.banned == 'true' && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo ":no_entry: **Banned Files Modified**"
            echo
            echo "Changes to the following files are not permitted:"
            echo
            sed 's|^|- `|; s|$|`|' banned_files.txt
            echo
            echo "Please revert your changes and re-submit a new pull request. Simply changing the file back to its original state and re-committing won't work (you must revert the changes made to it)."
          } > banned_files_comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file banned_files_comment.md

      - name: Halt pipeline on banned file changes
        if: steps.detect.outputs.banned == 'true' && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        run: |
          echo "::error::Banned files were modified. See the pull request comment for details."
          exit 1
