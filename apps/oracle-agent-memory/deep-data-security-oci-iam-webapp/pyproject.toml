[project]
name = "oracle-agent-memory-deepsec-webapp"
version = "0.1.0"
description = "Non-production OCI IAM and Oracle Deep Data Security how-to application"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask>=3.1,<4",
    "oracleagentmemory>=26.8.0",
    "python-dotenv>=1.2,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepsec_webapp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
