# Golden questions for the FULL Acme Ledger knowledge base
# (data/seed_full/docs + data/seed_full/slack_export.json). Grounded in that
# seed data so results are deterministic. Companion to data/golden_questions.yaml,
# which still passes against this larger seed too (see scripts/eval_full.py).
#
# Fields: question, user | principal | token, expected_source, must_include,
# must_not_include. See team_brain/evaluate.py for exact semantics.

# --- A. Company-wide docs, raw `user:` identity (no domain grant needed) ----

- question: "how do we deploy the billing service to production?"
