[project]
name = "team-brain"
version = "0.2.0"
description = "A team knowledge base done right: one shared table, any source plugs in, the database owns the policy. Oracle AI Database edition."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Oracle AI Database: the one shared table, in-database embeddings,
    # Oracle Text keyword search, and the row-level policy that enforces identity.
    # python-oracledb 26.x changed how object-type CLOB attributes bind; langchain-oracledb
    # 1.5's in-database OracleEmbeddings still passes plain str and fails with DPY-3013.
    "oracledb>=4.0.0,<26",
    # Oracle's LangChain package: OracleVS (vector store over our table),
    # OracleEmbeddings (in-database ONNX), OracleTextSearchRetriever (Oracle Text).
    "langchain-oracledb>=1.5.0",
    "langchain>=1.4.0",
    "langgraph>=1.2.0",
    # LLM for the CLI agent (planner/synthesizer). Any OpenAI-compatible endpoint.
    "langchain-openai>=1.0.0",
    # MCP server (primitives consumed by Claude Code or any MCP client)
    "mcp>=1.9.0,<2",
    # Connectors
    "slack-sdk>=3.27.0",
    "PyGithub>=2.3.0",
    "httpx>=0.27.0",
    # Config + data
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-PyYAML",
]

[project.scripts]
team-brain = "team_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["team_brain"]

[tool.pytest.ini_options]
markers = [
    "live: hits real external APIs/LLM, opt-in via TEAMBRAIN_LIVE=1",
    "requires_oracle: needs the Oracle AI Database Free container; skipped when it is unreachable",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# The connector stub is meant to be copied and renamed.
"team_brain/connectors/TEMPLATE.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
