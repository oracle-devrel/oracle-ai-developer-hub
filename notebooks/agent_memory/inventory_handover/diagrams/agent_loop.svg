<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The agent loop: context, model decision, tool execution and observation</title>
  <desc id="desc">The application assembles context and asks the model for its next step. If the model proposes a tool call, the host validates and executes an exposed tool. The tool's output or error is appended as an observation, and the cycle repeats. If the model answers, the loop finishes. The host also enforces a graph-step limit. In Part 5 this conversation is transient: no durable memory is connected yet.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536a80"/></marker>
    <g id="chat" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 3h30v23H15l-9 8v-8H3Z"/><path d="M9 10h18M9 17h12"/></g>
    <g id="chip" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="7" y="7" width="22" height="22" rx="3"/><path d="M12 0v7m12-7v7M12 29v7m12-7v7M0 12h7m-7 12h7m22-12h7m-7 12h7"/><rect x="13" y="13" width="10" height="10"/></g>
    <g id="screen" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="1" y="2" width="31" height="22" rx="3"/><path d="M8 31h18m-10-7v7M6 9h20M6 15h12"/></g>
    <g id="document" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 1h18l8 8v25H5ZM23 1v9h8M11 16h14M11 22h14M11 28h9"/></g>
  </defs>
  <rect width="1200" height="630" rx="18" fill="#f5f8fc"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#183247">
    <text x="36" y="45" font-size="28" font-weight="700">The agent loop: the model proposes; the application executes</text>
    <text x="36" y="80" font-size="17" fill="#4c6478">Part 5 adds tools and observations to the bare LLM. Persistent memory comes later.</text>
    <g stroke="#536a80" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <path d="M275 235H330"/>
      <path d="M590 235H645"/>
      <path d="M905 235H960"/>
      <path d="M460 320V380"/>
      <path d="M1062 320V510H155V320"/>
    </g>
    <text x="597" y="211" font-size="11" fill="#4c6478">tool call</text>
    <text x="478" y="354" font-size="14" fill="#4c6478">final answer</text>
    <rect x="35" y="160" width="240" height="160" rx="12" fill="#fff3db" stroke="#c39942"/>
    <use href="#chat" x="53" y="180" color="#a07629"/>
    <text x="100" y="207" font-size="21" font-weight="700">1. Build context</text>
    <text x="53" y="247" font-size="16">Instructions + user goal</text>
    <text x="53" y="272" font-size="16">Available tool definitions</text>
    <text x="53" y="297" font-size="16">Messages + observations</text>
    <rect x="330" y="160" width="260" height="160" rx="12" fill="#eee8fa" stroke="#9380b5"/>
    <use href="#chip" x="350" y="180" color="#776191"/>
    <text x="399" y="207" font-size="21" font-weight="700">2. Choose a step</text>
    <text x="350" y="247" font-size="16">Ollama runs the model</text>
    <text x="350" y="272" font-size="16">Propose a tool + arguments</text>
    <text x="350" y="297" font-size="16">Or produce a final answer</text>
    <rect x="645" y="160" width="260" height="160" rx="12" fill="#e4eefc" stroke="#5480b0"/>
    <use href="#screen" x="665" y="180" color="#3e6b99"/>
    <text x="711" y="207" font-size="21" font-weight="700">3. Execute tool</text>
    <text x="665" y="247" font-size="16">Host checks tool arguments</text>
    <text x="665" y="272" font-size="16">Runs the allowed function</text>
    <text x="665" y="297" font-size="16">Here: read reorder policy</text>
    <rect x="960" y="160" width="205" height="160" rx="12" fill="#eef7f3" stroke="#79a498"/>
    <use href="#document" x="977" y="180" color="#327567"/>
    <text x="1020" y="207" font-size="20" font-weight="700">4. Observe</text>
    <text x="978" y="247" font-size="16">Tool output or error</text>
    <text x="978" y="272" font-size="16">Becomes a message</text>
    <text x="978" y="297" font-size="16">For the next call</text>
    <rect x="330" y="380" width="300" height="72" rx="12" fill="#eef7f3" stroke="#79a498"/>
    <text x="350" y="409" font-size="20" font-weight="700">Finish: return the answer</text>
    <text x="350" y="435" font-size="15">Review its claims against the evidence</text>
    <rect x="690" y="380" width="340" height="72" rx="12" fill="#fff" stroke="#adbdcb"/>
    <text x="710" y="409" font-size="19" font-weight="700">The host also bounds the loop</text>
    <text x="710" y="435" font-size="15">recursion_limit caps graph execution steps</text>
    <text x="340" y="497" font-size="17" fill="#4c6478">5. Repeat: add the observation to context and ask the model again</text>
    <rect x="35" y="551" width="1130" height="51" rx="9" fill="#dceee8"/>
    <text x="55" y="582" font-size="17" font-weight="700">A tool loop is not persistent memory. A fresh Part 5 session does not automatically recover earlier notes.</text>
  </g>
</svg>
