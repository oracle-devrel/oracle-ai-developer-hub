<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc">
<title id="title">Bare LLM context flow and the gap between calls</title><desc id="desc">Call A sends instructions, the handover question and Alice's notes to the model. Call B sends only instructions and the question. The earlier evidence is not carried automatically between calls.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#536a80"/></marker>
<g id="person" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="16" cy="8" r="6"/><path d="M3 32v-5c0-12 26-12 26 0v5"/></g>
<g id="chip" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="6" y="6" width="23" height="23" rx="3"/><path d="M12 0v6m12-6v6M12 29v7m12-7v7M0 12h6m-6 12h6m23-12h7m-7 12h7"/><rect x="12" y="12" width="11" height="11" rx="1"/></g>
<g id="database" fill="none" stroke="currentColor" stroke-width="2.3"><ellipse cx="17" cy="6" rx="15" ry="5"/><path d="M2 6v23c0 7 30 7 30 0V6M2 17c0 7 30 7 30 0"/></g>
<g id="document" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 1h18l8 8v25H5ZM23 1v9h8M11 16h14M11 22h14M11 28h9"/></g>
<g id="loop" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12a13 13 0 0 1 24-3M29 22A13 13 0 0 1 5 27M21 8h9V0M13 28H4v8"/></g></defs>
<rect width="1200" height="635" rx="18" fill="#f5f8fc"/><g font-family="Arial,Helvetica,sans-serif">
<text x="35" y="44" font-size="26" font-weight="700" fill="#183247">Part 4.1: the same model, two different context windows</text><text x="35" y="78" font-size="18" font-weight="400" fill="#4c6478">A model call can only use the case evidence the application supplies to that call.</text><text x="42" y="123" font-size="20" font-weight="700" fill="#183247">CALL A  •  Notes supplied</text><rect x="45" y="143" width="390" height="154" rx="12" fill="#fff" stroke="#adbdcb"/><use href="#document" x="61" y="158" color="#536a80"/><text x="109" y="183" font-size="20" font-weight="700" fill="#183247">Context window</text><text x="63" y="219" font-size="17" font-weight="400" fill="#183247">System: use evidence only</text>
<text x="63" y="245" font-size="17" font-weight="400" fill="#183247">User: question + proposal + approval</text>
<text x="63" y="271" font-size="17" font-weight="400" fill="#183247">The latest note says 120, not ordered</text><rect x="500" y="159" width="215" height="122" rx="12" fill="#eee8fa" stroke="#adbdcb"/><use href="#chip" x="516" y="174" color="#536a80"/><text x="564" y="199" font-size="20" font-weight="700" fill="#183247">LLM</text><text x="518" y="235" font-size="17" font-weight="400" fill="#183247">Same model</text>
<text x="518" y="261" font-size="17" font-weight="400" fill="#183247">Same weights</text><rect x="800" y="143" width="355" height="154" rx="12" fill="#eef7f3" stroke="#adbdcb"/><use href="#document" x="816" y="158" color="#536a80"/><text x="864" y="183" font-size="20" font-weight="700" fill="#183247">Answer has evidence</text><text x="818" y="219" font-size="17" font-weight="400" fill="#183247">120 mugs approved</text>
<text x="818" y="245" font-size="17" font-weight="400" fill="#183247">Request PO-1048</text>
<text x="818" y="271" font-size="17" font-weight="400" fill="#183247">Order not submitted</text><path d="M435 221H498" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M715 221H798" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><rect x="45" y="316" width="1110" height="53" rx="12" fill="#fff3db" stroke="#d7bb80"/><text x="67" y="350" font-size="20" font-weight="700" fill="#183247">GAP: the previous notes and answer are not automatically inserted into the next call.</text><text x="42" y="410" font-size="20" font-weight="700" fill="#183247">CALL B  •  Notes deliberately omitted</text><rect x="45" y="430" width="390" height="147" rx="12" fill="#fff" stroke="#adbdcb"/><use href="#document" x="61" y="445" color="#536a80"/><text x="109" y="470" font-size="20" font-weight="700" fill="#183247">New context window</text><text x="63" y="506" font-size="17" font-weight="400" fill="#183247">System: same evidence instruction</text>
<text x="63" y="532" font-size="17" font-weight="400" fill="#183247">User: the same question only</text>
<text x="63" y="558" font-size="17" font-weight="400" fill="#183247">No proposal, approval or prior answer</text><rect x="500" y="436" width="215" height="122" rx="12" fill="#eee8fa" stroke="#adbdcb"/><use href="#chip" x="516" y="451" color="#536a80"/><text x="564" y="476" font-size="20" font-weight="700" fill="#183247">LLM</text><text x="518" y="512" font-size="17" font-weight="400" fill="#183247">No tools</text>
<text x="518" y="538" font-size="17" font-weight="400" fill="#183247">No store</text><rect x="800" y="430" width="355" height="147" rx="12" fill="#fff3db" stroke="#adbdcb"/><use href="#document" x="816" y="445" color="#536a80"/><text x="864" y="470" font-size="20" font-weight="700" fill="#183247">Case facts unknown</text><text x="818" y="506" font-size="17" font-weight="400" fill="#183247">A quantity or request ID</text>
<text x="818" y="532" font-size="17" font-weight="400" fill="#183247">would be unsupported here</text>
<text x="818" y="558" font-size="17" font-weight="400" fill="#183247">even if it sounds confident</text><path d="M435 497H498" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M715 497H798" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><text x="42" y="604" font-size="17" font-weight="400" fill="#4c6478">What fills the gap later? The application must replay notes or retrieve them from durable memory.</text>
</g></svg>
