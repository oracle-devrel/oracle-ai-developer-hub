<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img" aria-labelledby="title desc">
<title id="title">How Oracle Agent Memory retains and refines the mug case</title><desc id="desc">Source messages are retained, Ollama extracts candidate facts and preferences, a reviewer compares the proposal and approval, and a supersedes link marks the 80-mug proposal historical while keeping the 120-mug approval current for recall.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#536a80"/></marker>
<g id="person" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="16" cy="8" r="6"/><path d="M3 32v-5c0-12 26-12 26 0v5"/></g>
<g id="chip" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="6" y="6" width="23" height="23" rx="3"/><path d="M12 0v6m12-6v6M12 29v7m12-7v7M0 12h6m-6 12h6m23-12h7m-7 12h7"/><rect x="12" y="12" width="11" height="11" rx="1"/></g>
<g id="database" fill="none" stroke="currentColor" stroke-width="2.3"><ellipse cx="17" cy="6" rx="15" ry="5"/><path d="M2 6v23c0 7 30 7 30 0V6M2 17c0 7 30 7 30 0"/></g>
<g id="document" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 1h18l8 8v25H5ZM23 1v9h8M11 16h14M11 22h14M11 28h9"/></g>
<g id="loop" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12a13 13 0 0 1 24-3M29 22A13 13 0 0 1 5 27M21 8h9V0M13 28H4v8"/></g></defs>
<rect width="1200" height="775" rx="18" fill="#f5f8fc"/><g font-family="Arial,Helvetica,sans-serif">
<text x="35" y="43" font-size="26" font-weight="700" fill="#183247">Part 6: retain the source, extract meaning, review the change</text><text x="35" y="77" font-size="17" font-weight="400" fill="#4c6478">OAMP manages the lifecycle in Oracle; Ollama helps interpret text; a person reviews authority.</text><rect x="40" y="116" width="330" height="168" rx="12" fill="#eef7f3" stroke="#adbdcb"/><use href="#database" x="56" y="131" color="#536a80"/><text x="104" y="156" font-size="20" font-weight="700" fill="#183247">1. Retain messages</text><text x="58" y="192" font-size="17" font-weight="400" fill="#183247">Alice: propose 80 mugs</text>
<text x="58" y="218" font-size="17" font-weight="400" fill="#183247">Later: approve 120; not ordered</text>
<text x="58" y="244" font-size="17" font-weight="400" fill="#183247">Original words stay available</text>
<text x="58" y="270" font-size="17" font-weight="400" fill="#183247">Episodic memory</text><rect x="433" y="116" width="330" height="168" rx="12" fill="#eee8fa" stroke="#adbdcb"/><use href="#chip" x="449" y="131" color="#536a80"/><text x="497" y="156" font-size="20" font-weight="700" fill="#183247">2. Extract with Ollama</text><text x="451" y="192" font-size="17" font-weight="400" fill="#183247">OAMP schedules background work</text>
<text x="451" y="218" font-size="17" font-weight="400" fill="#183247">The model selects facts/preferences</text>
<text x="451" y="244" font-size="17" font-weight="400" fill="#183247">Source metadata is retained</text>
<text x="451" y="270" font-size="17" font-weight="400" fill="#183247">Wait before inspecting the result</text><rect x="825" y="116" width="335" height="168" rx="12" fill="#fff3db" stroke="#adbdcb"/><use href="#document" x="841" y="131" color="#536a80"/><text x="889" y="156" font-size="20" font-weight="700" fill="#183247">3. Inspect candidates</text><text x="843" y="192" font-size="17" font-weight="400" fill="#183247">Typed memory records</text>
<text x="843" y="218" font-size="17" font-weight="400" fill="#183247">Possible links between records</text>
<text x="843" y="244" font-size="17" font-weight="400" fill="#183247">These are interpretations,</text>
<text x="843" y="270" font-size="17" font-weight="400" fill="#183247">not automatic business approval</text><path d="M370 198H431" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M763 198H823" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M993 284V326H206V363" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><rect x="40" y="365" width="330" height="168" rx="12" fill="#fff" stroke="#adbdcb"/><use href="#person" x="56" y="380" color="#536a80"/><text x="104" y="405" font-size="20" font-weight="700" fill="#183247">4. Review both notes</text><text x="58" y="441" font-size="17" font-weight="400" fill="#183247">80 was the proposed quantity</text>
<text x="58" y="467" font-size="17" font-weight="400" fill="#183247">120 was the approved quantity</text>
<text x="58" y="493" font-size="17" font-weight="400" fill="#183247">Save a reviewed fact for each</text>
<text x="58" y="519" font-size="17" font-weight="400" fill="#183247">Choose the relationship explicitly</text><rect x="450" y="365" width="305" height="168" rx="12" fill="#eef7f3" stroke="#adbdcb"/><use href="#document" x="466" y="380" color="#536a80"/><text x="514" y="405" font-size="20" font-weight="700" fill="#183247">Current fact</text><text x="468" y="441" font-size="17" font-weight="400" fill="#183247">120 mugs approved</text>
<text x="468" y="467" font-size="17" font-weight="400" fill="#183247">PO-1048; no order submitted</text>
<text x="468" y="493" font-size="17" font-weight="400" fill="#183247">VALID for current recall</text>
<text x="468" y="519" font-size="17" font-weight="400" fill="#183247">Semantic memory</text><rect x="835" y="365" width="325" height="168" rx="12" fill="#fff3db" stroke="#adbdcb"/><use href="#document" x="851" y="380" color="#536a80"/><text x="899" y="405" font-size="20" font-weight="700" fill="#183247">Historical proposal</text><text x="853" y="441" font-size="17" font-weight="400" fill="#183247">80 mugs were proposed</text>
<text x="853" y="467" font-size="17" font-weight="400" fill="#183247">Retain the old record</text>
<text x="853" y="493" font-size="17" font-weight="400" fill="#183247">INVALID for direct current hits</text>
<text x="853" y="519" font-size="17" font-weight="400" fill="#183247">Not deleted; linked history</text><path d="M370 445H448" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M755 445H833" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><text x="710" y="564" font-size="17" font-weight="700" fill="#327567">Current approval supersedes old proposal</text><rect x="40" y="609" width="1120" height="99" rx="12" fill="#e4eefc" stroke="#5480b0"/><use href="#loop" x="60" y="631" color="#3e6b99"/><text x="110" y="643" font-size="22" font-weight="700" fill="#183247">5. Recall into the next agent turn</text><text x="110" y="679" font-size="18" font-weight="400" fill="#183247">Current facts + selected history + shared procedures → working context → handover draft</text><path d="M605 534V607" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><text x="40" y="746" font-size="17" font-weight="400" fill="#4c6478">Refining stored knowledge is not changing model weights. A recorded approval still does not submit an order.</text>
</g></svg>
