<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" role="img" aria-labelledby="title desc">
<title id="title">User, thread and shared procedure scopes</title><desc id="desc">The ZH_INVENTORY store contains Alice's mug thread, Bob's unrelated returns thread and shared procedures with user_id None. User and thread labels are retrieval scopes, not authorization boundaries.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#536a80"/></marker>
<g id="person" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="16" cy="8" r="6"/><path d="M3 32v-5c0-12 26-12 26 0v5"/></g>
<g id="chip" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="6" y="6" width="23" height="23" rx="3"/><path d="M12 0v6m12-6v6M12 29v7m12-7v7M0 12h6m-6 12h6m23-12h7m-7 12h7"/><rect x="12" y="12" width="11" height="11" rx="1"/></g>
<g id="database" fill="none" stroke="currentColor" stroke-width="2.3"><ellipse cx="17" cy="6" rx="15" ry="5"/><path d="M2 6v23c0 7 30 7 30 0V6M2 17c0 7 30 7 30 0"/></g>
<g id="document" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 1h18l8 8v25H5ZM23 1v9h8M11 16h14M11 22h14M11 28h9"/></g>
<g id="loop" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12a13 13 0 0 1 24-3M29 22A13 13 0 0 1 5 27M21 8h9V0M13 28H4v8"/></g></defs>
<rect width="1200" height="712" rx="18" fill="#f5f8fc"/><g font-family="Arial,Helvetica,sans-serif">
<text x="35" y="43" font-size="26" font-weight="700" fill="#183247">Part 6.4: a user organizes knowledge; a thread groups a case</text><text x="35" y="76" font-size="18" font-weight="400" fill="#4c6478">All three branches below live in the same workshop store and database account.</text><rect x="390" y="106" width="420" height="89" rx="12" fill="#e4eefc" stroke="#adbdcb"/><use href="#database" x="406" y="121" color="#536a80"/><text x="454" y="146" font-size="20" font-weight="700" fill="#183247">Oracle store: ZH_INVENTORY</text><path d="M490 195V229H210V263" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M600 195V263" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><path d="M710 195V229H990V263" fill="none" stroke="#536a80" stroke-width="2.4"  marker-end="url(#arrow)" /><rect x="40" y="265" width="340" height="260" rx="12" fill="#eef7f3" stroke="#adbdcb"/><use href="#person" x="56" y="280" color="#536a80"/><text x="104" y="305" font-size="20" font-weight="700" fill="#183247">User: ALICE</text><text x="58" y="341" font-size="17" font-weight="400" fill="#183247">Reusable knowledge for Alice</text><rect x="59" y="367" width="302" height="127" rx="12" fill="#fff" stroke="#adbdcb"/><text x="75" y="399" font-size="19" font-weight="700" fill="#183247">Thread: mugs-{RUN_ID}</text><text x="75" y="431" font-size="17" font-weight="400" fill="#183247">Case RESTOCK-101</text>
<text x="75" y="457" font-size="17" font-weight="400" fill="#183247">Shift messages + facts + preference</text><rect x="430" y="265" width="340" height="260" rx="12" fill="#fff3db" stroke="#adbdcb"/><use href="#person" x="446" y="280" color="#536a80"/><text x="494" y="305" font-size="20" font-weight="700" fill="#183247">User: BOB</text><text x="448" y="341" font-size="17" font-weight="400" fill="#183247">A different application label</text><rect x="449" y="367" width="302" height="127" rx="12" fill="#fff" stroke="#adbdcb"/><text x="465" y="399" font-size="19" font-weight="700" fill="#183247">Thread: returns-{RUN_ID}</text><text x="465" y="431" font-size="17" font-weight="400" fill="#183247">Separate tote-bag case</text>
<text x="465" y="457" font-size="17" font-weight="400" fill="#183247">Its return note is not mug evidence</text><rect x="820" y="265" width="340" height="260" rx="12" fill="#e4eefc" stroke="#adbdcb"/><use href="#document" x="836" y="280" color="#536a80"/><text x="884" y="305" font-size="20" font-weight="700" fill="#183247">Shared: user_id=None</text><text x="838" y="341" font-size="17" font-weight="400" fill="#183247">Not inside Alice's or Bob's thread</text><rect x="839" y="367" width="302" height="127" rx="12" fill="#fff" stroke="#adbdcb"/><text x="855" y="399" font-size="19" font-weight="700" fill="#183247">Approved procedures</text><text x="855" y="431" font-size="17" font-weight="400" fill="#183247">General steps for replenishment,</text>
<text x="855" y="457" font-size="17" font-weight="400" fill="#183247">deliveries, returns and counts</text><rect x="40" y="550" width="1120" height="96" rx="12" fill="#fff" stroke="#adbdcb"/><text x="61" y="580" font-size="17" font-weight="700" fill="#183247">Select user + thread to recover a case. Select user + guideline/source to reuse a method across cases.</text><text x="61" y="610" font-size="17" font-weight="400" fill="#183247">A user can have many threads; this lab creates one per user. The next planner's host chooses Alice's case.</text><text x="40" y="685" font-size="17" font-weight="400" fill="#4c6478">These labels select relevant records. They do not authenticate people or enforce database permissions.</text>
</g></svg>
