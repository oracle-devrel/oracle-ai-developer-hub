<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval and reranking flow</title>
  <desc id="desc">A Paris source record becomes a chunk and embedding, Oracle Vector Search returns candidates, a reranker orders them, and the answer policy selects grounded evidence with a citation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Arial, sans-serif; fill: #172033; }
      .detail { font: 14px Arial, sans-serif; fill: #374151; }
      .arrow-label { font: 13px Arial, sans-serif; fill: #4b5563; }
      .box { stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title">Two-stage retrieval keeps evidence inspectable</text>

  <!-- Connectors are drawn before nodes so arrowheads stop cleanly at box borders. -->
  <g fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="190" y1="145" x2="235" y2="145"/>
    <line x1="390" y1="145" x2="435" y2="145"/>
    <line x1="590" y1="145" x2="635" y2="145"/>
    <line x1="790" y1="145" x2="835" y2="145"/>
    <line x1="990" y1="145" x2="1035" y2="145"/>
  </g>
  <text x="212" y="126" text-anchor="middle" class="arrow-label">split</text>
  <text x="412" y="126" text-anchor="middle" class="arrow-label">embed</text>
  <text x="612" y="126" text-anchor="middle" class="arrow-label">retrieve k=8</text>
  <text x="812" y="126" text-anchor="middle" class="arrow-label">reorder</text>
  <text x="1012" y="126" text-anchor="middle" class="arrow-label">validate</text>

  <g>
    <rect x="35" y="95" width="155" height="100" class="box" fill="#e7f0ff" stroke="#4d78b8"/>
    <text x="112" y="128" text-anchor="middle" class="label">Source record</text>
    <text x="112" y="153" text-anchor="middle" class="detail">body + provenance</text>
    <text x="112" y="174" text-anchor="middle" class="detail">Paris Dataset</text>

    <rect x="235" y="95" width="155" height="100" class="box" fill="#e7f0ff" stroke="#4d78b8"/>
    <text x="312" y="128" text-anchor="middle" class="label">Chunk</text>
    <text x="312" y="153" text-anchor="middle" class="detail">stable chunk_id</text>
    <text x="312" y="174" text-anchor="middle" class="detail">metadata travels</text>

    <rect x="435" y="95" width="155" height="100" class="box" fill="#e9f7ef" stroke="#4e9b6d"/>
    <text x="512" y="128" text-anchor="middle" class="label">Embedding</text>
    <text x="512" y="153" text-anchor="middle" class="detail">numeric meaning</text>
    <text x="512" y="174" text-anchor="middle" class="detail">OpenAIEmbeddings</text>

    <rect x="635" y="95" width="155" height="100" class="box" fill="#fff4df" stroke="#c38a2e"/>
    <text x="712" y="128" text-anchor="middle" class="label">OracleVS</text>
    <text x="712" y="153" text-anchor="middle" class="detail">candidate set</text>
    <text x="712" y="174" text-anchor="middle" class="detail">distance + filter</text>

    <rect x="835" y="95" width="155" height="100" class="box" fill="#fff4df" stroke="#c38a2e"/>
    <text x="912" y="128" text-anchor="middle" class="label">Reranker</text>
    <text x="912" y="153" text-anchor="middle" class="detail">precision signal</text>
    <text x="912" y="174" text-anchor="middle" class="detail">does not add facts</text>

    <rect x="1035" y="95" width="130" height="100" class="box" fill="#f0eaff" stroke="#7c5ab8"/>
    <text x="1100" y="128" text-anchor="middle" class="label">Policy</text>
    <text x="1100" y="153" text-anchor="middle" class="detail">ground or</text>
    <text x="1100" y="174" text-anchor="middle" class="detail">abstain</text>
  </g>

  <rect x="300" y="245" width="600" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="600" y="275" text-anchor="middle" class="detail">Selected Document keeps title, URL, chunk ID, and corpus version for the citation.</text>
</svg>
