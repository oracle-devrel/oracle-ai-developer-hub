services:
  oracle:
    # The tag and digest are the x86_64 image validated in versions.md.
    image: container-registry.oracle.com/database/free:23.26.2.0-lite-amd64@sha256:d2463c765bbc91de8c7de47dbbb55b133b165bfd5a47ff17e7d28e0f8d4706f6
    container_name: oracle-rag-tutorial
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env before starting the database}
    volumes:
      - oracle-rag-data:/opt/oracle/oradata
      # Oracle Free runs executable .sh/.sql files from this standard startup hook.
      - ./scripts/container-init:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  oracle-rag-data:
    name: oracle-rag-tutorial-data
